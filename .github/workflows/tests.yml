name: tests

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (without torch/transformers, not needed by the unit tests)
        run: pip install numpy scipy pandas pytest
      - name: Run unit tests
        run: python -m pytest -q
